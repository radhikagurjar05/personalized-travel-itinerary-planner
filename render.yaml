services:
  # Single combined Flask + React service
  - type: web
    name: personalized-travel-itinerary-planner
    runtime: python
    branch: main
    plan: free
    buildCommand: |
      pip install --upgrade pip && pip install -r requirements.txt &&
      cd frontend && npm install && npm run build
    startCommand: "gunicorn backend.app:app"
    healthCheckPath: "/api/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: FLASK_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
